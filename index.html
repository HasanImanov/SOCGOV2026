<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xankəndi Konqres Mərkəzi — Qonaq Yerləşdirmə</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16233d;
    --navy-2: #1f314f;
    --gold: #bd9757;
    --gold-bright: #d9b876;
    --paper: #f6f3ec;
    --paper-2: #efe9db;
    --ink: #23262c;
    --ink-soft: #5a5f6b;
    --line: rgba(35,38,44,0.12);
    --burgundy: #7d2634;
    --ok-bg: #eef1e6;
    --card-bg: #ffffff;
    --shadow: 0 10px 30px rgba(22,35,61,0.10);
    --radius-s: 6px;
    --radius-m: 12px;
  }
  :root:not([data-theme="light"]){
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #12151c;
      --paper-2: #171b24;
      --ink: #ece9e1;
      --ink-soft: #a3a7b3;
      --line: rgba(236,233,225,0.12);
      --card-bg: #1b2029;
      --navy: #0e1626;
      --navy-2: #16233d;
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --paper: #12151c;
    --paper-2: #171b24;
    --ink: #ece9e1;
    --ink-soft: #a3a7b3;
    --line: rgba(236,233,225,0.12);
    --card-bg: #1b2029;
    --navy: #0e1626;
    --navy-2: #16233d;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .top{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #f3efe4;
    padding: 34px 20px 46px;
    position: relative;
    overflow:hidden;
  }
  .top::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:3px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
  }
  .top-inner{
    max-width: 920px; margin:0 auto; text-align:center; position:relative; z-index:1;
  }
  .eyebrow{
    font-size: 13px; letter-spacing: 0.04em; color: var(--gold-bright);
    margin: 0 0 10px;
  }
  .top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(28px, 4.4vw, 42px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .top p.sub{
    margin:0; color: rgba(243,239,228,0.72); font-size:15px;
  }

  .search-wrap{
    max-width: 640px; margin: -26px auto 0; padding: 0 20px; position:relative; z-index:2;
  }
  .search-box{
    background: var(--card-bg);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow);
    padding: 8px;
    display:flex; gap:8px; align-items:center;
    border: 1px solid var(--line);
  }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-size: 17px; padding: 12px 10px; color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .search-box input::placeholder{ color: var(--ink-soft); }
  .search-icon{ padding-left:10px; color: var(--ink-soft); display:flex; }

  .suggestions{
    background: var(--card-bg);
    border-radius: 0 0 var(--radius-m) var(--radius-m);
    box-shadow: var(--shadow);
    margin-top:-8px;
    overflow:hidden;
    border: 1px solid var(--line); border-top:none;
    display:none;
  }
  .suggestions.show{ display:block; }
  .sugg-item{
    padding: 12px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    border-bottom: 1px solid var(--line);
    font-size:15px;
  }
  .sugg-item:last-child{ border-bottom:none; }
  .sugg-item:hover, .sugg-item.active{ background: var(--paper-2); }
  .sugg-name{ font-weight:600; }
  .sugg-table{ color: var(--ink-soft); font-size:13px; }

  .result-card{
    margin: 16px 20px 0; max-width:600px; margin-left:auto; margin-right:auto;
    background: var(--card-bg);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 22px 24px;
    display:none;
    animation: pop .28s ease;
  }
  .result-card.show{ display:flex; align-items:center; gap:18px; justify-content:space-between; }
  @keyframes pop{ from{ opacity:0; transform: translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .result-name{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; }
  .result-loc{ color: var(--ink-soft); font-size:13.5px; margin-top:4px; }
  .result-table{
    text-align:center; background: var(--navy); color:#fff; border-radius: var(--radius-s);
    padding: 10px 18px; min-width:88px;
  }
  .result-table .num{ font-family:'Fraunces', serif; font-size:28px; font-weight:700; color: var(--gold-bright); line-height:1; }
  .result-table .lbl{ font-size:10.5px; letter-spacing:0.05em; color: rgba(255,255,255,0.7); margin-top:4px; }

  .not-found{
    margin: 16px 20px 0; max-width:600px; margin-left:auto; margin-right:auto;
    text-align:center; color: var(--ink-soft); font-size:14px; display:none;
  }
  .not-found.show{ display:block; }

  .map-section{ max-width: 1040px; margin: 40px auto 0; padding: 0 20px 60px; }
  .map-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .map-header h2{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; margin:0; }
  .map-header .hint{ font-size:12.5px; color: var(--ink-soft); }

  .hall{
    background: var(--card-bg);
    border-radius: var(--radius-m);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 28px 20px 34px;
    overflow-x:auto;
  }
  .stage{
    background: var(--navy);
    color: var(--gold-bright);
    text-align:center;
    font-family:'Fraunces', serif;
    letter-spacing: 0.04em;
    font-size: 13px;
    padding: 10px 0;
    border-radius: var(--radius-s);
    margin: 0 auto 30px;
    max-width: 320px;
  }
  .rows{ display:flex; flex-direction:column; gap:22px; align-items:center; min-width: 340px; }
  .row{ display:flex; gap:16px; justify-content:center; flex-wrap:nowrap; }
  .table-el{
    width:56px; height:56px; border-radius:50%;
    background: var(--paper-2);
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color: var(--ink);
    flex-shrink:0;
    transition: transform .35s ease, box-shadow .35s ease, background .35s ease, border-color .35s ease;
    cursor:default; position:relative;
  }
  .table-el.highlight{
    background: var(--gold);
    border-color: var(--gold-bright);
    color: var(--navy);
    transform: scale(1.28);
    box-shadow: 0 0 0 6px rgba(189,151,87,0.22), 0 8px 18px rgba(189,151,87,0.35);
    z-index:3;
  }
  @keyframes ring{
    0%{ box-shadow: 0 0 0 0 rgba(189,151,87,0.5);}
    100%{ box-shadow: 0 0 0 14px rgba(189,151,87,0);}
  }
  .table-el.highlight::after{
    content:""; position:absolute; inset:-2px; border-radius:50%;
    animation: ring 1.1s ease-out 2;
  }

  .legend{ display:flex; gap:18px; justify-content:center; margin-top:26px; flex-wrap:wrap; font-size:12.5px; color: var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:12px; height:12px; border-radius:50%; display:inline-block; }

  footer{ text-align:center; color: var(--ink-soft); font-size:12px; padding: 0 20px 34px; }

  /* Tablet and phone tuning */
  @media (max-width: 760px){
    .top{ padding: 26px 16px 40px; }
    .search-wrap{ padding: 0 14px; }
    .map-section{ padding: 0 14px 44px; }
    .hall{ padding: 22px 12px 26px; }
  }

  @media (max-width:480px){
    .table-el{ width:42px; height:42px; font-size:12.5px; }
    .row{ gap:8px; }
    .rows{ gap:12px; }
    .result-card.show{ flex-direction:column; align-items:flex-start; gap:12px; }
    .result-table{ align-self:stretch; }
    .top h1{ font-size:26px; }
    .search-box input{ font-size:16px; padding:11px 8px; }
    .legend{ gap:10px; font-size:11.5px; }
  }

  /* Larger tap targets everywhere on touch devices */
  @media (pointer: coarse){
    input{ font-size: max(14px, inherit); }
  }
</style>
</head>
<body>
  <script type="application/json" id="seedData">{"layout":{"rows":5,"perRow":6},"guests":[{"id":"g1","name":"Həsən Əliyev","table":3},{"id":"g2","name":"Aynur Məmmədova","table":12},{"id":"g3","name":"Rəşad Hüseynov","table":7},{"id":"g4","name":"Nərmin Quliyeva","table":1},{"id":"g5","name":"Tural Abbasov","table":18},{"id":"g6","name":"Sevinc Bayramova","table":25}]}</script>

  <div class="top">
    <div class="top-inner">
      <p class="eyebrow">XANKƏNDİ KONQRES MƏRKƏZİ</p>
      <h1>Qonaq Yerləşdirmə Sistemi</h1>
      <p class="sub">Adı yazın — masa nömrəsi və zaldakı yeri dərhal görünsün</p>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input id="searchInput" type="text" placeholder="Qonağın adını yazın..." autocomplete="off">
    </div>
    <div class="suggestions" id="suggestions"></div>
    <div class="result-card" id="resultCard">
      <div>
        <div class="result-name" id="resultName"></div>
        <div class="result-loc" id="resultLoc"></div>
      </div>
      <div class="result-table">
        <div class="num" id="resultTableNum"></div>
        <div class="lbl">MASA</div>
      </div>
    </div>
    <div class="not-found" id="notFound">Bu adda qonaq tapılmadı. Adı yoxlayın.</div>
  </div>

  <div class="map-section">
    <div class="map-header">
      <h2>Zal Sxemi</h2>
      <span class="hint" id="mapHint">Axtarış edin — masa xəritədə işıqlanacaq</span>
    </div>
    <div class="hall">
      <div class="stage">SƏHNƏ</div>
      <div class="rows" id="rowsContainer"></div>
      <div class="legend">
        <span><i style="background:var(--paper-2); border:2px solid var(--line);"></i> Boş masa</span>
        <span><i style="background:var(--gold);"></i> Axtarılan qonağın masası</span>
      </div>
    </div>
  </div>

  <footer>Xankəndi Konqres Mərkəzi</footer>

<script>
(function(){
  const DEFAULT_STATE = {
    layout: { rows: 5, perRow: 6 },
    guests: [
      { id: 'g1', name: 'Həsən Əliyev', table: 3 },
      { id: 'g2', name: 'Aynur Məmmədova', table: 12 },
      { id: 'g3', name: 'Rəşad Hüseynov', table: 7 },
      { id: 'g4', name: 'Nərmin Quliyeva', table: 1 },
      { id: 'g5', name: 'Tural Abbasov', table: 18 },
      { id: 'g6', name: 'Sevinc Bayramova', table: 25 }
    ]
  };

  function normalize(parsed){
    if(!parsed || typeof parsed !== 'object') return JSON.parse(JSON.stringify(DEFAULT_STATE));
    if(!parsed.layout) parsed.layout = { rows:5, perRow:6 };
    if(!parsed.guests) parsed.guests = [];
    return parsed;
  }

  // Source of truth: the seed script embedded in the page. Edit the JSON
  // inside <script id="seedData"> directly in this file to update guests.
  function loadSeedState(){
    try{
      const el = document.getElementById('seedData');
      if(!el) return null;
      return normalize(JSON.parse(el.textContent));
    }catch(e){
      console.error('Seed parse error', e);
      return null;
    }
  }

  const state = loadSeedState() || JSON.parse(JSON.stringify(DEFAULT_STATE));

  const az = s => (s||'').toLocaleLowerCase('az').trim();

  function totalTables(){ return state.layout.rows * state.layout.perRow; }

  function renderHall(){
    const container = document.getElementById('rowsContainer');
    container.innerHTML = '';
    let tableNum = 1;
    for(let r=0; r<state.layout.rows; r++){
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      for(let c=0; c<state.layout.perRow; c++){
        const t = document.createElement('div');
        t.className = 'table-el';
        t.dataset.table = tableNum;
        t.textContent = tableNum;
        rowEl.appendChild(t);
        tableNum++;
      }
      container.appendChild(rowEl);
    }
  }

  function clearHighlight(){
    document.querySelectorAll('.table-el.highlight').forEach(el=>el.classList.remove('highlight'));
  }

  function locationDescription(tableNumber){
    const perRow = state.layout.perRow;
    const idx = tableNumber - 1;
    const row = Math.floor(idx / perRow) + 1;
    const col = (idx % perRow) + 1;
    const zone = row <= Math.ceil(state.layout.rows/3) ? 'səhnəyə yaxın' : (row >= state.layout.rows - Math.ceil(state.layout.rows/3) + 1 ? 'arxa hissə' : 'orta hissə');
    return `${row}-ci sıra, soldan ${col}-ci masa — ${zone}`;
  }

  function highlightTable(tableNumber){
    clearHighlight();
    const el = document.querySelector('.table-el[data-table="'+tableNumber+'"]');
    if(el){
      el.classList.add('highlight');
      el.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
    }
  }

  function showResult(guest){
    document.getElementById('notFound').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultName').textContent = guest.name;
    document.getElementById('resultTableNum').textContent = guest.table;
    const inRange = guest.table >= 1 && guest.table <= totalTables();
    document.getElementById('resultLoc').textContent = inRange ? locationDescription(guest.table) : 'Bu masa cari zal sxemində göstərilmir';
    if(inRange) highlightTable(guest.table); else clearHighlight();
  }

  function showNotFound(){
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('notFound').classList.add('show');
    clearHighlight();
  }

  function hideResults(){
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('notFound').classList.remove('show');
    clearHighlight();
  }

  // Search
  const searchInput = document.getElementById('searchInput');
  const suggestionsEl = document.getElementById('suggestions');

  function runSearch(q){
    const query = az(q);
    if(!query){
      suggestionsEl.classList.remove('show');
      hideResults();
      return;
    }
    const matches = state.guests.filter(g => az(g.name).includes(query));
    if(matches.length === 0){
      suggestionsEl.classList.remove('show');
      showNotFound();
      return;
    }
    if(matches.length === 1){
      suggestionsEl.classList.remove('show');
      showResult(matches[0]);
      return;
    }
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('notFound').classList.remove('show');
    suggestionsEl.innerHTML = matches.slice(0,8).map(g =>
      `<div class="sugg-item" data-id="${g.id}"><span class="sugg-name">${escapeHtml(g.name)}</span><span class="sugg-table">Masa ${g.table}</span></div>`
    ).join('');
    suggestionsEl.classList.add('show');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  searchInput.addEventListener('input', (e)=> runSearch(e.target.value));
  suggestionsEl.addEventListener('click', (e)=>{
    const item = e.target.closest('.sugg-item');
    if(!item) return;
    const guest = state.guests.find(g=>g.id === item.dataset.id);
    if(guest){
      searchInput.value = guest.name;
      suggestionsEl.classList.remove('show');
      showResult(guest);
    }
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')){
      suggestionsEl.classList.remove('show');
    }
  });

  // Init
  renderHall();
})();
</script>
</body>
</html>
